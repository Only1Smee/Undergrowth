<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1310">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="UNDERGROWTH - survive a dark jungle island. Craft, build, hunt, fight rival tribes and keep the fire burning.">
<title>UNDERGROWTH</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:ctext;src:url(ug-text.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:ctext;src:url(ug-text-bold.woff) format('woff');font-weight:700;font-display:swap}
@font-face{font-family:cdisp;src:url(ug-display.woff) format('woff');font-weight:700;font-display:swap}
:root{--bg:#0b1310;--panel:rgba(12,20,16,.94);--line:rgba(232,220,176,.16);--bone:#e8dcb0;--dim:#93a08a;--ember:#ff8a3c;--ember2:#ffb468;--leaf:#5f9a4a;--blood:#d24a3a;--water:#4fb6d6;--sat:env(safe-area-inset-top);--sal:env(safe-area-inset-left);--sar:env(safe-area-inset-right);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--bone);font-family:ctext,system-ui,sans-serif;font-size:14px;overscroll-behavior:none;touch-action:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid rgba(255,180,104,.55);background:linear-gradient(#a8521f,#7a3713);color:#fff3e0;padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;letter-spacing:.02em;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--bone)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:8px}
.btn.big{padding:14px 22px;font-size:17px}
.btn[disabled]{opacity:.38;filter:grayscale(.8);pointer-events:none}
.btn small{font-weight:400;opacity:.75;font-size:12px}
.dim{color:var(--dim);font-size:12.5px}
/* touch layers */
#lookpad{position:fixed;inset:0;z-index:2;touch-action:none}
#stickzone{position:fixed;left:0;bottom:0;width:42%;height:62%;z-index:3;touch-action:none}
#stickBase{position:fixed;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(232,220,176,.25);background:rgba(0,0,0,.18);opacity:0;transition:opacity .15s;pointer-events:none}
#stickBase.on{opacity:1}
#stickKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;border-radius:50%;background:rgba(232,220,176,.5);transform:translate(-50%,-50%)}
.stk-hint{position:absolute;left:calc(26px + var(--sal));bottom:calc(22px + var(--sab));font-size:11px;letter-spacing:.2em;color:rgba(232,220,176,.35);pointer-events:none}
#xhair{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 2px rgba(0,0,0,.35);z-index:4;pointer-events:none}
/* HUD */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud button,#hud canvas,#hud .hs{pointer-events:auto}
.vitals{position:absolute;left:calc(10px + var(--sal));top:calc(8px + var(--sat));display:flex;flex-direction:column;gap:4px;width:clamp(120px,18vw,170px)}
.vit{display:flex;align-items:center;gap:6px;font-size:11px}
.vit .ico{width:15px;height:15px}
.vit .bar{flex:1;height:7px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.vit .bar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.vit.low{animation:lowp 1s infinite}
@keyframes lowp{50%{opacity:.45}}
#vHp{background:linear-gradient(90deg,#9b2a1f,#e05040)}#vFood{background:linear-gradient(90deg,#8a5a1f,#d9a04a)}#vWater{background:linear-gradient(90deg,#1f5a7a,#4fb6d6)}#vEnergy{background:linear-gradient(90deg,#6a7a1f,#c9d65a)}#vSan{background:linear-gradient(90deg,#4a2f7a,#a07ae0)}
.c-hp{color:#e05040}.c-food{color:#d9a04a}.c-water{color:#4fb6d6}.c-en{color:#c9d65a}.c-san{color:#a07ae0}
#conds{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.cond{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:2px 6px;border-radius:6px;background:rgba(150,30,20,.7);color:#ffe2d8}
.cond.n{background:rgba(30,70,90,.7);color:#d8f2ff}
.cond .ico{width:12px;height:12px}
.topc{position:absolute;left:50%;top:calc(6px + var(--sat));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;text-shadow:0 1px 3px #000}
#dayLbl{display:flex;align-items:center;gap:7px;font-size:13px;background:rgba(0,0,0,.35);padding:4px 11px;border-radius:12px}
#dayLbl b{font-family:cdisp,serif;letter-spacing:.1em;font-size:15px}
#dayLbl span{color:var(--dim);font-size:12px}
#fireBox{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ember2)}
#fireBox .fb{width:90px;height:5px;border-radius:3px;background:rgba(0,0,0,.5);overflow:hidden}
#fireBar{height:100%;background:linear-gradient(90deg,#c0461a,#ffb468)}
#fireBox.low{animation:lowp .8s infinite;color:#ff6a4a}
#obj{font-size:11.5px;color:var(--bone);opacity:.85;max-width:46vw;text-align:center}
.tr{position:absolute;right:calc(10px + var(--sar));top:calc(8px + var(--sat));display:flex;gap:6px;align-items:flex-start}
#mini{width:clamp(92px,15vw,124px);height:clamp(92px,15vw,124px);border-radius:12px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.5)}
.rb{width:clamp(38px,6vw,46px);height:clamp(38px,6vw,46px);border-radius:12px;border:1px solid var(--line);background:rgba(10,18,14,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;letter-spacing:.06em}
.rb .ico{width:18px;height:18px}
.acts{position:absolute;right:calc(14px + var(--sar));bottom:calc(14px + var(--sab));display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:end}
#btnAtk{grid-column:2;grid-row:2;width:clamp(74px,12vw,96px);height:clamp(74px,12vw,96px);border-radius:50%;border:2px solid rgba(255,180,104,.6);background:radial-gradient(circle at 40% 35%,#c0612a,#7a2f10);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.1em;box-shadow:0 4px 14px rgba(0,0,0,.5)}
#btnAtk .ico{width:30px;height:30px}
#btnAtk.placing{background:radial-gradient(circle at 40% 35%,#3f8a3a,#1f4a1c);border-color:#8ad07a}
#btnUse{grid-column:1;grid-row:2;min-width:clamp(62px,10vw,78px);height:clamp(54px,9vw,64px);border-radius:16px;border:1px solid rgba(232,220,176,.4);background:rgba(20,34,26,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 8px;max-width:150px}
#btnUse .ico{width:22px;height:22px}
#useLbl{font-size:10px;line-height:1.1;text-align:center;max-width:136px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnUse.dim{opacity:.45}
.smbtns{grid-column:1/3;grid-row:1;display:flex;gap:8px}
#hotbar{position:absolute;left:50%;bottom:calc(10px + var(--sab));transform:translateX(-50%);display:flex;gap:6px}
.hs{position:relative;width:clamp(42px,6.5vw,52px);height:clamp(42px,6.5vw,52px);border-radius:10px;border:1px solid var(--line);background:rgba(10,18,14,.75);display:flex;align-items:center;justify-content:center}
.hs .ico{width:22px;height:22px}
.hs.on{border-color:var(--ember);box-shadow:0 0 0 2px rgba(255,138,60,.35);background:rgba(90,40,14,.8)}
.hs i{position:absolute;right:3px;top:1px;font-style:normal;font-size:10px}
.hs em{position:absolute;left:3px;top:1px;font-style:normal;font-size:10px;color:var(--ember2)}
.hs u{position:absolute;left:4px;bottom:3px;height:3px;border-radius:2px;background:var(--leaf);text-decoration:none;max-width:calc(100% - 8px)}
#placeBar{position:absolute;left:50%;bottom:calc(74px + var(--sab));transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#toasts{position:fixed;left:calc(12px + var(--sal));top:42%;z-index:7;display:flex;flex-direction:column;gap:5px;pointer-events:none;max-width:44vw}
.toast{background:rgba(8,14,11,.85);border-left:3px solid var(--leaf);padding:6px 10px;border-radius:6px;font-size:12.5px;animation:tin .25s;transition:opacity .4s,transform .4s}
.toast.bad{border-color:var(--blood)}.toast.good{border-color:var(--ember)}.toast.pk{border-color:var(--bone);font-size:12px}
.toast.out{opacity:0;transform:translateX(-10px)}
@keyframes tin{from{opacity:0;transform:translateX(-12px)}}
#hint{position:fixed;left:50%;top:calc(76px + var(--sat));transform:translateX(-50%);z-index:7;display:flex;gap:8px;align-items:center;max-width:min(560px,60vw);background:rgba(30,22,10,.9);border:1px solid rgba(255,180,104,.4);padding:8px 12px;border-radius:10px;font-size:13px;pointer-events:auto}
#hint .ico{color:var(--ember2)}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:6;text-align:center;opacity:0;pointer-events:none;text-shadow:0 2px 12px #000}
#banner b{display:block;font-family:cdisp,serif;font-size:clamp(28px,6vw,52px);letter-spacing:.18em;color:var(--bone)}
#banner span{display:block;font-size:14px;color:var(--ember2);margin-top:4px}
#banner.show{animation:ban 4.2s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-40%)}12%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0}}
#flash{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(transparent 40%,rgba(200,20,10,.55));opacity:0}
#flash.on{animation:fl .45s}
@keyframes fl{0%{opacity:1}100%{opacity:0}}
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(40,0,10,.85));opacity:0;transition:opacity .6s}
#vig.pulse{animation:vp 1.1s infinite}
@keyframes vp{50%{filter:brightness(1.6)}}
#fade{position:fixed;inset:0;z-index:30;background:#000;opacity:0;pointer-events:none;transition:opacity .8s}
#fade.on{opacity:1;pointer-events:auto}
/* sheets */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:calc(8px + var(--sat)) calc(8px + var(--sar)) calc(8px + var(--sab)) calc(8px + var(--sal))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;width:min(440px,96vw);max-height:100%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.6);-webkit-overflow-scrolling:touch;touch-action:pan-y}
.panel.wide{width:min(860px,98vw);height:min(560px,100%);display:flex;flex-direction:column;padding:0;overflow:hidden}
.panel h2{font-family:cdisp,serif;font-size:20px;letter-spacing:.08em;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.panel h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ember2);margin:14px 0 6px}
.pmenu{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.pbody{color:#cfd6c4;font-size:13.5px;line-height:1.45}
.quote{font-size:15px;line-height:1.5;font-style:italic;border-left:3px solid var(--ember);padding-left:12px}
.tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:0;background:transparent;border-radius:10px 10px 0 0;color:var(--dim);font-weight:700;font-size:13px}
.tab.on{background:rgba(255,138,60,.12);color:var(--bone);box-shadow:inset 0 -2px 0 var(--ember)}
.tab.x{flex:0 0 46px}
.tbody{flex:1;overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.items{display:flex;gap:12px;height:100%}
.grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;align-content:start}
.slot{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.slot .ico{width:24px;height:24px}
.slot i{position:absolute;right:5px;top:3px;font-style:normal;font-size:11px;font-weight:700}
.slot small{font-size:9.5px;color:var(--dim);text-align:center;line-height:1.05;max-height:2.1em;overflow:hidden}
.slot.on{border-color:var(--ember);background:rgba(255,138,60,.12)}
.slot.eq::after{content:'E';position:absolute;left:5px;top:3px;font-size:10px;color:var(--ember2);font-weight:700}
.slot.sm{aspect-ratio:auto;height:66px}
.det{flex:0 0 min(250px,38%);border-left:1px solid var(--line);padding-left:12px}
.dh{display:flex;align-items:center;gap:8px;font-size:16px}
.dh .ico{width:30px;height:30px;color:var(--ember2)}
.ds{color:var(--dim);font-size:12.5px;margin:8px 0;line-height:1.5}
.dd{font-size:12.5px;font-style:italic;margin-bottom:8px}
.dacts{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--dim);padding:20px;grid-column:1/-1;text-align:center}
.rc{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;opacity:.75}
.rc.ok{opacity:1;border-color:rgba(255,180,104,.35)}
.ri .ico{width:28px;height:28px;color:var(--ember2)}
.rm{flex:1}
.rm em{font-style:normal;font-size:9.5px;letter-spacing:.1em;color:var(--water);margin-left:6px;border:1px solid rgba(79,182,214,.5);padding:1px 4px;border-radius:4px}
.rn{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.nd{font-size:11.5px;color:#d07a6a;display:inline-flex;align-items:center;gap:3px}
.nd.ok{color:#9fd08a}
.nd .ico{width:13px;height:13px}
.cnote{font-size:12.5px;color:var(--dim);padding:8px;border-radius:8px;background:rgba(255,255,255,.03)}
.cnote.ok{color:#9fd08a}
.journal .jp,.campt .jp{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid var(--line);font-size:13px}
.jp span{color:var(--dim);margin-left:auto;font-size:12px;text-align:right}
.jp.ok .ico{color:#9fd08a}
.page{background:#e8dcb0;color:#2a2418;border-radius:6px;padding:10px 12px;margin-bottom:8px;font-family:Georgia,serif}
.page p{margin:6px 0 0;font-size:13.5px;line-height:1.5}
.page.miss{background:rgba(232,220,176,.08);color:var(--dim)}
.survs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sv{border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.sv b{font-size:13px}.sv span{color:var(--dim)}
.sv.ok{border-color:rgba(159,208,138,.5)}.sv.ok .ico{color:#9fd08a}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stats span{background:rgba(255,255,255,.05);border-radius:8px;padding:6px 10px;font-size:12px}
.stats b{color:var(--ember2);margin-left:4px}
.fuelbar{position:relative;height:18px;border-radius:9px;background:rgba(0,0,0,.5);overflow:hidden;margin-bottom:6px}
.fuelbar div{height:100%;background:linear-gradient(90deg,#c0461a,#ffb468)}
.fuelbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;text-shadow:0 1px 2px #000}
.fuels{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.upg{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.store{display:flex;gap:12px}.store>div{flex:1}
.paper{background:#e8dcb0;color:#2a2418;border-radius:8px;padding:16px 18px;font-family:Georgia,serif;box-shadow:inset 0 0 40px rgba(120,90,40,.35)}
.paper h2{color:#3a2a14;font-family:Georgia,serif;letter-spacing:0}
.paper p{font-size:15px;line-height:1.6}
.pn{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a6440}
.sig{text-align:right;font-style:italic;color:#5a4a30}
.panel.paperw{width:min(520px,96vw)}
.panel.mapp{width:auto;padding:10px}
.mapw canvas{width:min(80vh,86vw);height:min(80vh,86vw);max-height:calc(100vh - 110px);max-width:calc(100vh - 110px);border-radius:10px;image-rendering:pixelated;display:block}
.mlegend{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--dim);margin-top:6px;flex-wrap:wrap}
.lg{width:10px;height:10px;border-radius:50%;display:inline-block}.lg.f{background:#ff9a3c}.lg.p{background:#fff}.lg.o{background:#5fe0ff}.lg.e{background:#e04a3a}
.how p{font-size:13.5px;line-height:1.5;margin:0 0 9px}
/* title & story */
#title{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:flex-start;padding-left:calc(6vw + var(--sal));background:linear-gradient(90deg,rgba(5,9,7,.88),rgba(5,9,7,.35) 60%,transparent)}
.tbox{display:flex;flex-direction:column;gap:10px;max-width:420px}
.logo{font-family:cdisp,serif;font-size:clamp(40px,8vw,74px);letter-spacing:.12em;line-height:1;color:var(--bone);text-shadow:0 0 30px rgba(255,138,60,.35),0 3px 0 #000}
.tag{color:var(--ember2);font-size:15px;letter-spacing:.06em;margin-bottom:10px}
.tbtns{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.trow{display:flex;gap:8px}.trow .btn{flex:1}
#story{position:fixed;inset:0;z-index:26;background:#050806;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8vw;cursor:pointer}
.stxt{font-family:Georgia,serif;font-size:clamp(17px,2.6vw,24px);line-height:1.6;max-width:720px;text-align:center;animation:tin2 1s}
@keyframes tin2{from{opacity:0}}
.snext{margin-top:28px;color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.sskip{position:absolute;right:calc(16px + var(--sar));top:calc(14px + var(--sat))}
.end{position:fixed;inset:0;z-index:27;display:flex;align-items:center;justify-content:center;background:radial-gradient(rgba(40,5,5,.75),rgba(0,0,0,.95))}
.end.won{background:radial-gradient(rgba(60,40,10,.7),rgba(0,0,0,.92))}
.ebox{text-align:center;max-width:560px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.et{font-family:cdisp,serif;font-size:clamp(36px,7vw,64px);letter-spacing:.14em}
.end.dead .et{color:var(--blood)}.end.won .et{color:var(--ember2)}
.es{font-size:15px;line-height:1.5}
#rotate{display:none}
@media (orientation:portrait) and (pointer:coarse){#rotate{display:flex;position:fixed;inset:0;z-index:99;background:#050806;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}#rotate .ico{width:64px;height:64px;color:var(--ember2);animation:rot 2s infinite}}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (max-height:420px){.vitals{gap:2px}.vit{font-size:10px}#obj{display:none}.panel.wide{height:100%}.acts{gap:7px}}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="lookpad" class="hidden"></div>
<div id="stickzone" class="hidden"><div id="stickBase"><div id="stickKnob"></div></div><div class="stk-hint">MOVE</div></div>
<div id="xhair" class="hidden"></div>
<div id="hud" class="hidden">
  <div class="vitals">
    <div class="vit"><span class="c-hp">{i:heart}</span><div class="bar"><i id="vHp"></i></div></div>
    <div class="vit"><span class="c-food">{i:food}</span><div class="bar"><i id="vFood"></i></div></div>

// convert icon tokens already in the page
(function(){const w=document.createTreeWalker(document.body,NodeFilter.SHOW_ELEMENT);const els=[];while(w.nextNode())els.push(w.currentNode);for(const e of els){if(e.children.length===0&&e.textContent.indexOf('{i:')>=0)e.innerHTML=e.textContent;else for(const n of [...e.childNodes])if(n.nodeType===3&&n.nodeValue.indexOf('{i:')>=0){const s=document.createElement('span');s.innerHTML=n.nodeValue;n.replaceWith(...s.childNodes);}}})();
</script>
